<div class=" px-4 pb-6 lg:px-6">
  <div class="sticky top-[78px]  z-20 mx-auto max-w-xl bg-linear-to-r from-red-500 via-orange-500 to-amber-300 text-white rounded-3xl shadow-2xl shadow-red-500/20 py-4 px-5 text-center">
    <h1 aria-label="heading" class="text-xl sm:text-2xl font-bold tracking-wide">
      🙏 हमर विभूति 🙏
    </h1>
  </div>

  <div class="mt-4">
    <mat-accordion class="w-full space-y-4">
      @for(leaderDetail of leaderList; track $index) {
        <mat-expansion-panel class="overflow-hidden rounded-[28px] shadow-xl transition-shadow duration-300 hover:shadow-red-400/30">
          <mat-expansion-panel-header class="bg-white/90 backdrop-blur-sm rounded-[28px] border border-amber-200">
            <mat-panel-title class="text-base sm:text-lg font-semibold text-red-600">
              <span aria-label="{{leaderDetail.title}}" class="w-full text-center block">
                {{leaderDetail.title}}
              </span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <div class="bg-gradient-to-br from-amber-50 via-orange-50 to-white p-4 sm:p-5">
            <img
              [src]="leaderDetail.image"
              alt="{{leaderDetail.title}}"
              loading="lazy"
              class="w-full max-w-full h-56 sm:h-72 object-cover rounded-[28px] shadow-2xl shadow-red-200 mx-auto"
            />

            <div class="mt-4 rounded-[28px] bg-white/95 p-4 sm:p-5 text-sm sm:text-base leading-relaxed text-gray-800 shadow-inner border border-amber-200">
              {{leaderDetail.detail}}
            </div>
          </div>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</div>
