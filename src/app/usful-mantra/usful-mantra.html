<div class="px-4 pb-6 lg:px-6">
  <div class="sticky top-[78px]  z-20 mx-auto max-w-sm bg-linear-to-r from-red-500 via-orange-500 to-amber-300 text-white rounded-3xl shadow-2xl shadow-red-500/20 py-4 px-5 text-center">
    <span aria-label="उपयोगी मंत्र" class="font-bold text-xl sm:text-2xl">|| उपयोगी मंत्र ||</span>
  </div>

  <div class="mt-4 max-w-3xl mx-auto">
    <mat-accordion class="space-y-4">
      @for(mantra of mantralist; track $index) {
        <mat-expansion-panel class="overflow-hidden rounded-3xl bg-white border border-amber-200 shadow-xl transition-shadow duration-300 hover:shadow-red-400/20">
          <mat-expansion-panel-header class="bg-amber-100 hover:bg-amber-200 transition-colors rounded-3xl">
            <mat-panel-title class="text-base sm:text-lg font-semibold text-red-700">
              <span aria-label="{{mantra.title}}" class="block w-full text-left">
                {{mantra.title}}
              </span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <div class="p-4 sm:p-5 bg-linear-to-br from-amber-50 via-orange-50 to-white">
            <div aria-label="mantra" class="text-lg sm:text-xl leading-relaxed text-gray-900 font-semibold whitespace-pre-wrap">
              {{mantra.mantra}}
            </div>

            @if (mantra.meaning) {
              <div aria-label="meaning" class="mt-5 rounded-3xl bg-red-50 border border-red-200 p-4 text-sm sm:text-base text-gray-800">
                <div class="font-bold text-red-600 mb-2">अर्थ</div>
                <div class="whitespace-pre-wrap">{{mantra.meaning}}</div>
              </div>
            }
          </div>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</div>
