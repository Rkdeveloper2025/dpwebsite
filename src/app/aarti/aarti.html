<div class="w-full pl-2 pr-2 pt-2 pb-0">
  <img class="h-40 sm:h-56 lg:h-60 w-full object-cover rounded-xl sm:rounded-2xl shadow-lg" loading="lazy" src="assets/images/web-cover_1730381618.gif" alt="आरती संग्रह"/>
</div>

<!-- Header Section -->
<div class="sticky top-[78px]  z-10 p-3 sm:p-4 mt-3 sm:mt-4 text-xl sm:text-2xl lg:text-3xl bg-gradient-to-r from-red-500 to-red-600 rounded-xl sm:rounded-2xl shadow-lg text-center w-full sm:w-[90%] lg:w-[80%] mx-auto">
    <span aria-label="आरती संग्रह" class="font-bold text-white drop-shadow-md">आरती संग्रह</span>
</div>

<!-- Accordion Section -->
<div class="px-2 sm:px-4 mb-4 mt-3 sm:mt-4">
 <mat-accordion class="w-full custom-accordion">
    @for(aarti of aartiList(); track $index) {
            <mat-expansion-panel class="mb-3 sm:mb-4 rounded-xl sm:rounded-2xl overflow-hidden shadow-md hover:shadow-lg transition-shadow">
                <mat-expansion-panel-header class="bg-gradient-to-r from-amber-300 to-amber-200 hover:from-amber-400 hover:to-amber-300 transition-colors">
                    <mat-panel-title class="text-base sm:text-lg lg:text-xl font-bold w-full">
                        <span aria-label="{{aarti.title}}" class="w-full text-red-600 text-center">{{aarti.title}}</span>
                    </mat-panel-title>
                </mat-expansion-panel-header>
                
                <div aria-label="lyrics" class="p-4 sm:p-6 lg:p-8 bg-gradient-to-br from-amber-50 to-orange-50 border-t-4 border-red-500">
                    <div class="max-w-3xl mx-auto">
                        <div class="text-base sm:text-lg lg:text-xl leading-relaxed sm:leading-relaxed text-center text-gray-800 font-semibold whitespace-pre-wrap break-words">
                            {{aarti.lyrics}}
                        </div>
                    </div>
                </div>
            </mat-expansion-panel>
       
    } 
    </mat-accordion>  
</div>
