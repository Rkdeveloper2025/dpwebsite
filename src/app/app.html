<div class="container relative mx-auto h-full bg-amber-200 text-red-600 overflow-x-hidden">
    <div class="fixed w-full z-50 p-2 h-[70px] text-center  font-bold text-red-500 text-shadow-2xs text-shadow-white bg-[url('/dpwebsite/assets/images/IMG-20251020-WA0014.jpg')] bg-cover bg-center">

        <span class="text-lg">( स्थापित १९९२ )</span>
    </div>
    <div class=" block lg:relative lg:flex w-full h-full pb-[70px] lg:pt-[140px] lg:pb-0 overflow-x-hidden overflow-y-auto">

        </div>
        <div class="w-full lg:w-[50vw] mb-[30px]">
            <router-outlet />
            <div class="hidden lg:block h-2 w-full"></div>
        </div>
        
        <div class="w-[25vw] bg-blue-200 hidden lg:block sticky top-0">
            <img src="assets/images/decorated-shankh.jpg" alt="Place View" class="w-full h-full object-cover"/>
        </div>
    </div>
   
    
    <!-- navigation -->
   <nav class="fixed bottom-0 lg:top-[70px] left-0 z-50 w-full h-16 bg-amber-400 border-t lg:border-b border-amber-400 border-default">
      <div class="grid h-full max-w-full grid-cols-4 mx-auto font-medium">
          <button type="button" routerLinkActive="bg-amber-500" class="inline-flex lg:flex-row items-center justify-center px-5 hover:bg-neutral-secondary-medium group text-2xl lg:cursor-pointer hover:bg-amber-500" routerLink="/home">

              <span class="hidden lg:inline lg:text-2xl lg:ml-2 ">मां जगजननी</span>
          </button>
          <button type="button" routerLinkActive="bg-amber-500" class="inline-flex lg:flex-row items-center justify-center px-5 hover:bg-neutral-secondary-medium group lg:cursor-pointer hover:bg-amber-500" routerLink="/calendar">

              <span class="hidden lg:inline lg:text-2xl lg:ml-2 ">पंचांग</span>
          </button>
          <button type="button" routerLinkActive="bg-amber-500" class="inline-flex lg:flex-row items-center justify-center px-5 hover:bg-neutral-secondary-medium group text-2xl lg:cursor-pointer hover:bg-amber-500" routerLink="/aarti">

          </button>
          <button type="button" class="inline-flex lg:flex-row items-center justify-center px-5 hover:bg-neutral-secondary-medium group text-2xl lg:cursor-pointer hover:bg-amber-500" [matMenuTriggerFor]="navMenu">

              <span class="hidden lg:inline lg:text-2xl lg:ml-2 ">अन्य</span>
          </button>
      </div>
    </nav>
  
</div>
