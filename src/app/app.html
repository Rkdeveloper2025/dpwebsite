<div class="min-h-screen relative overflow-x-hidden bg-gradient-to-b from-amber-100 via-amber-200 to-orange-100 text-red-700">
  <header class="fixed inset-x-0 top-0 z-50 h-[80px] bg-[url('/dpwebsite/assets/images/IMG-20251020-WA0014.jpg')] bg-cover bg-center shadow-2xl">
    <div class="h-full w-full bg-black/20 backdrop-blur-sm flex flex-col justify-center items-center px-4 text-center">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white drop-shadow-lg">
        श्री श्री १०८ दुर्गा पूजा समिति हरसुवार
      </h1>
      <p class="text-sm sm:text-base text-amber-100 mt-1">( स्थापित १९९२ )</p>
    </div>
  </header>

  <main class="pt-[100px] pb-28 lg:pt-[100px] lg:pb-0 absolute">
    <div class="mx-auto flex flex-col lg:flex-row max-w-screen-2xl  relative">
      <aside class="hidden lg:block lg:w-[22vw] sticky top-[100px] h-[calc(100vh-200px)] pl-8">
        <div class="h-full rounded-[36px] overflow-hidden shadow-2xl">
          <img src="assets/images/place-view.jpg" alt="Place View" class="w-full h-full object-cover"/>
        </div>
      </aside>

      <section class="w-full lg:mb-[100px] lg:w-[56vw] px-4 lg:px-6">
        <div class="bg-white/90 backdrop-blur-xl rounded-[32px] shadow-2xl border border-amber-200 p-4 sm:p-6 lg:p-8">
          <router-outlet />
        </div>
      </section>

      <aside class="hidden lg:block lg:w-[22vw] sticky top-[100px] h-[calc(100vh-200px)] pr-8">
        <div class="h-full rounded-[36px] overflow-hidden shadow-2xl">
          <img src="assets/images/decorated-shankh.jpg" alt="Decorated Shankh" class="w-full h-full object-cover"/>
        </div>
      </aside>
    </div>
  </main>

  <nav class="fixed inset-x-0 bottom-0 z-50 border-t border-amber-300 bg-amber-400/95 backdrop-blur-sm shadow-xl">
    <div class="mx-auto grid max-w-4xl grid-cols-4">
      <button type="button" routerLink="/home" routerLinkActive="bg-amber-500" class="inline-flex flex-col items-center justify-center gap-1 py-3 text-red-800 transition hover:bg-amber-500">
        <span class="text-2xl font-extrabold">&#2384;</span>
        <span class="text-xs sm:text-sm font-semibold">मां जगजननी</span>
      </button>

      <button type="button" routerLink="/calendar" routerLinkActive="bg-amber-500" class="inline-flex flex-col items-center justify-center gap-1 py-3 text-red-800 transition hover:bg-amber-500">
        <mat-icon aria-hidden="false" aria-label="calendar-icon" fontIcon="calendar_today"></mat-icon>
        <span class="text-xs sm:text-sm font-semibold">पंचांग</span>
      </button>

      <button type="button" routerLink="/aarti" routerLinkActive="bg-amber-500" class="inline-flex flex-col items-center justify-center gap-1 py-3 text-red-800 transition hover:bg-amber-500">
        <img src="assets/icons/aarti.svg" alt="Aarti Icon" class="w-8 h-8"/>
        <span class="text-xs sm:text-sm font-semibold">आरती</span>
      </button>

      <button type="button" [matMenuTriggerFor]="navMenu" class="inline-flex flex-col items-center justify-center gap-1 py-3 text-red-800 transition hover:bg-amber-500">
        <mat-icon aria-hidden="false" aria-label="menu-icon" fontIcon="menu"></mat-icon>
        <span class="text-xs sm:text-sm font-semibold">अन्य</span>
      </button>
    </div>
  </nav>
</div>

<mat-menu #navMenu="matMenu" class="rounded-3xl bg-amber-100 py-2 px-1 shadow-2xl">
  <button mat-menu-item routerLink="/leaders" class="rounded-2xl px-4 py-3 transition hover:bg-amber-300">
    <img src="assets/icons/person.svg" class="inline w-5 h-5" alt="Leaders"/>
    <span class="ml-3 text-base font-bold text-red-600">हमर विभूति</span>
  </button>

  <button mat-menu-item routerLink="/useful-mantra" class="rounded-2xl px-4 py-3 transition hover:bg-amber-300">
    <span class="font-extrabold text-red-600">&#2384;</span>
    <span class="ml-3 text-base font-bold text-red-600">किछू उपयोगी मंत्र</span>
  </button>

  <a mat-menu-item href="https://youtube.com/channel/UCjPXRasfLq-trjZ5vSYgiDg?si=rEEw5EYl3wKswHh7" target="_blank" rel="noreferrer" class="rounded-2xl px-4 py-3 transition hover:bg-amber-300">
    <img src="assets/icons/youtube.svg" class="inline w-5 h-5" alt="Gallery"/>
    <span class="ml-3 text-base font-bold text-red-600">गैलरी</span>
  </a>
</mat-menu>
